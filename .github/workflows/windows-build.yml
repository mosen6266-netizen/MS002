name: Windows V9 Build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
permissions:
  contents: write

concurrency:
  group: v9-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.414

      # CI-only Python runs sqlite3 integrity snapshots before/after upgrade.
      # The shipped installer and customer PC require no Python installation.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Compiler is used only by GitHub CI. End users still receive the
      # completely offline JRE; no JDK installation is needed.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Generate desktop and installer icon
        shell: powershell
        run: .\tools\GenerateBrandIcon.ps1

      - name: Restore
        run: dotnet restore SignalScheduler.V8.sln

      - name: Build
        run: dotnet build SignalScheduler.V8.sln -c Release --no-restore

      - name: Tests
        run: dotnet test tests/SignalScheduler.Migration.Tests/SignalScheduler.Migration.Tests.csproj -c Release --no-build

      - name: Publish desktop
        run: dotnet publish src/SignalScheduler.Desktop/SignalScheduler.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/publish/Desktop

      - name: Publish engine
        run: dotnet publish src/SignalScheduler.Engine/SignalScheduler.Engine.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/publish/Engine

      - name: Stamp installed GitHub build number
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $info = @{
            version = '9.0.6'
            build = [int]${{ github.run_number }}
            sourceSha = '${{ github.sha }}'
          } | ConvertTo-Json -Compress
          $target = Join-Path $pwd 'artifacts/publish/Desktop/build-info.json'
          [System.IO.File]::WriteAllText($target, $info, [System.Text.UTF8Encoding]::new($false))
          Write-Host "Packaged update metadata: $info"

      - name: WPF main window startup smoke test
        shell: powershell
        run: |
          # Catch runtime XAML parsing/template errors that dotnet build alone
          # cannot catch. This launch is on an isolated CI machine without
          # Signal accounts and sends no messages.
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $pwd 'artifacts/publish/Desktop/SignalScheduler.exe'
          if (-not (Test-Path $exe)) { throw 'Published desktop EXE missing' }
          $app = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 5
            $app.Refresh()
            if ($app.HasExited) {
              throw "WPF desktop exited during startup: $($app.ExitCode)"
            }
          } finally {
            $app.Refresh()
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }

      - name: WPF table column layout smoke test
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $pwd 'artifacts/publish/Desktop/SignalScheduler.exe'
          $report = Join-Path $env:RUNNER_TEMP 'ms002-ui-layout-smoke.txt'
          Remove-Item -LiteralPath $report -Force -ErrorAction SilentlyContinue
          $result = Start-Process -FilePath $exe -ArgumentList @('--ui-layout-smoke',"$report") -Wait -PassThru
          Write-Host "Layout smoke exit code: $($result.ExitCode)"
          if (Test-Path -LiteralPath $report) {
            Get-Content -LiteralPath $report
          } else {
            Write-Host "Layout smoke did not create its report; app may have exited before the check."
          }
          if ($result.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $report)) {
            Write-Host "Latest .NET Runtime error events:"
            Get-WinEvent -FilterHashtable @{
              LogName='Application'; StartTime=(Get-Date).AddMinutes(-8); Id=1026
            } -ErrorAction SilentlyContinue |
              Select-Object -First 4 -ExpandProperty Message | Out-String | Write-Host
            throw "WPF layout smoke failed; see process exit code and layout diagnostics above"
          }

      - name: Bundle pinned Java 25 and signal-cli
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $ghHeaders = @{ "User-Agent" = "MS002-CI"; "Authorization" = "Bearer $env:GITHUB_TOKEN"; "Accept" = "application/vnd.github+json" }
          $runtime = Join-Path $pwd "artifacts/publish/Runtime/signal-stack-v1"
          New-Item -ItemType Directory -Force $runtime | Out-Null

          # The pinned GitHub release assets are large. Invoke-WebRequest can
          # terminate on a transient TCP reset. Use curl.exe with HTTP/1.1,
          # bounded retries, and a clean file on every retry; checksum checks
          # below still reject corrupted or substituted assets.
          function Save-ReleaseAsset {
            param([string]$AssetUrl,[string]$Destination)
            $curl = (Get-Command curl.exe -ErrorAction Stop).Source
            for ($attempt=1; $attempt -le 4; $attempt++) {
              Remove-Item -LiteralPath $Destination -Force -ErrorAction SilentlyContinue
              & $curl --fail --location --silent --show-error --http1.1 --connect-timeout 30 --max-time 600 --output $Destination $AssetUrl
              $exitCode = $LASTEXITCODE
              if ($exitCode -eq 0 -and (Test-Path -LiteralPath $Destination) -and
                  (Get-Item -LiteralPath $Destination).Length -gt 0) {
                return
              }
              if ($attempt -lt 4) {
                Write-Warning "Release asset download interrupted (attempt $attempt/4, curl exit $exitCode); retrying."
                Start-Sleep -Seconds ([int][Math]::Min(40,5*[Math]::Pow(2,$attempt-1)))
              }
            }
            throw "Release asset download failed after 4 attempts (no unverified runtime will be packaged)."
          }

          # signal-cli: pin a specific signed GitHub release and verify GitHub's asset digest when present.
          $signalVersion = "0.14.9"
          $release = Invoke-RestMethod -Headers $ghHeaders -Uri "https://api.github.com/repos/AsamK/signal-cli/releases/tags/v$signalVersion"
          $assetName = "signal-cli-$signalVersion.tar.gz"
          $asset = $release.assets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
          if (-not $asset) { throw "signal-cli asset not found: $assetName" }
          $signalArchive = Join-Path $pwd "signal-cli.tar.gz"
          Save-ReleaseAsset -AssetUrl $asset.browser_download_url -Destination $signalArchive
          if ($asset.digest -and $asset.digest -match "^sha256:(.+)$") {
            $actual = (Get-FileHash $signalArchive -Algorithm SHA256).Hash.ToLowerInvariant()
            $expected = $Matches[1].ToLowerInvariant()
            if ($actual -ne $expected) { throw "signal-cli SHA256 mismatch" }
          }
          $signalExtract = Join-Path $pwd "signal-cli-extract"
          New-Item -ItemType Directory -Force $signalExtract | Out-Null
          tar -xzf $signalArchive -C $signalExtract
          $signalRoot = Get-ChildItem $signalExtract -Directory | Where-Object { $_.Name -like "signal-cli-*" } | Select-Object -First 1
          if (-not $signalRoot) { throw "signal-cli extraction failed" }
          Move-Item $signalRoot.FullName (Join-Path $runtime "signal-cli")
          if (-not (Test-Path (Join-Path $runtime "signal-cli/bin/signal-cli.bat"))) { throw "signal-cli.bat missing" }

          # Eclipse Temurin JRE 25: pin 25.0.4.1+1 and verify the checksum asset from the official GitHub release.
          $jreVersion = "25.0.4.1+1"
          $jreTag = [uri]::EscapeDataString("jdk-$jreVersion")
          $temurinRelease = Invoke-RestMethod -Headers $ghHeaders -Uri "https://api.github.com/repos/adoptium/temurin25-binaries/releases/tags/$jreTag"
          $jreAssetName = "OpenJDK25U-jre_x64_windows_hotspot_25.0.4.1_1.zip"
          $jreAsset = $temurinRelease.assets | Where-Object { $_.name -eq $jreAssetName } | Select-Object -First 1
          $jreChecksumAsset = $temurinRelease.assets | Where-Object { $_.name -eq "$jreAssetName.sha256.txt" } | Select-Object -First 1
          if (-not $jreAsset -or -not $jreChecksumAsset) { throw "Pinned Temurin JRE assets not found" }
          $jreArchive = Join-Path $pwd "temurin-jre.zip"
          $jreChecksumFile = Join-Path $pwd "temurin-jre.sha256.txt"
          Save-ReleaseAsset -AssetUrl $jreAsset.browser_download_url -Destination $jreArchive
          Save-ReleaseAsset -AssetUrl $jreChecksumAsset.browser_download_url -Destination $jreChecksumFile
          $jreHash = (Get-FileHash $jreArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedJreHash = $null
          if ($jreAsset.digest -and $jreAsset.digest -match "^sha256:(?<hash>[0-9a-fA-F]{64})$") {
            $expectedJreHash = $Matches["hash"].ToLowerInvariant()
          } else {
            $checksumText = (Get-Content -Raw $jreChecksumFile)
            $match = [regex]::Match($checksumText, "(?i)(?<hash>[0-9a-f]{64})")
            if (-not $match.Success) { throw "Unable to parse Temurin SHA256" }
            $expectedJreHash = $match.Groups["hash"].Value.ToLowerInvariant()
          }
          if ($jreHash -ne $expectedJreHash) {
            throw "Temurin JRE SHA256 mismatch actual=$jreHash expected=$expectedJreHash"
          }
          $jreExtract = Join-Path $pwd "jre-extract"
          Expand-Archive -Force $jreArchive $jreExtract
          $jreRoot = Get-ChildItem $jreExtract -Directory | Select-Object -First 1
          if (-not $jreRoot) { throw "Temurin JRE extraction failed" }
          Move-Item $jreRoot.FullName (Join-Path $runtime "jre")
          if (-not (Test-Path (Join-Path $runtime "jre/bin/java.exe"))) { throw "java.exe missing" }

          # Runtime smoke test before installer packaging.
          & (Join-Path $runtime "jre/bin/java.exe") -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled Java failed" }
          $bundledJava = Join-Path $runtime "jre\bin\java.exe"
          $bundledCp = Join-Path $runtime "signal-cli\lib\*"
          & $bundledJava "-Duser.language=en" "-Duser.country=US" -classpath $bundledCp org.asamk.signal.Main --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled signal-cli direct-Java runtime failed" }

      - name: Generate verified runtime integrity manifest
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $runtime = Join-Path $pwd "artifacts/publish/Runtime/signal-stack-v1"
          $jarDir = Join-Path $runtime "signal-cli/lib"
          $jars = @(Get-ChildItem -LiteralPath $jarDir -File -Filter "*.jar" | Sort-Object Name)
          if ($jars.Count -lt 2) { throw "Missing expected signal-cli dependency jars" }
          # Extract the *pinned upstream* argparse4j resource bundle to a
          # separate, hash-verified directory placed first on the classpath.
          # A JAR can be byte-perfect yet Windows/JVM resource lookups may
          # fail on some supported hosts. The standalone resources provide
          # the identical English strings without changing argparse4j code.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $overlay = Join-Path $runtime "signal-cli/resource-overlay"
          $bundleDir = Join-Path $overlay "net/sourceforge/argparse4j/internal"
          New-Item -ItemType Directory -Force $bundleDir | Out-Null
          $resourceNames = @(
            "net/sourceforge/argparse4j/internal/ArgumentParserImpl.properties",
            "net/sourceforge/argparse4j/internal/ArgumentParserImpl_en.properties"
          )
          $copied = [System.Collections.Generic.HashSet[string]]::new()
          foreach ($jar in $jars) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead($jar.FullName)
            try {
              foreach ($resource in $resourceNames) {
                $entry = $zip.GetEntry($resource)
                if ($null -eq $entry) { continue }
                if (-not $copied.Add($resource)) { throw "Duplicate argparse4j resource found in multiple JARs" }
                $target = Join-Path $overlay ($resource.Replace("/","\"))
                [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entry,$target)
              }
            } finally { $zip.Dispose() }
          }
          if ($copied.Count -ne $resourceNames.Count) { throw "Pinned argparse4j bundle missing root or English resource" }
          & javac --release 17 -d $overlay "resources/MS002ResourceBundleProbe.java"
          if ($LASTEXITCODE -ne 0) { throw "Could not compile bundled Java ResourceBundle probe" }

          # Execute the same exact ResourceBundle.getBundle() call before the
          # installer is allowed to ship, not just check JAR ZIP entries.
          $jreJava = Join-Path $runtime "jre/bin/java.exe"
          $probeCp = "$overlay;$jarDir/*"
          $probeResult = & $jreJava "-Duser.language=en" "-Duser.country=US" -classpath $probeCp MS002ResourceBundleProbe
          if ($LASTEXITCODE -ne 0 -or $probeResult -notcontains "MS002_BUNDLE_OK") {
            throw "Java cannot resolve argparse4j ResourceBundle even with pinned resource overlay"
          }

          $java = Join-Path $runtime "jre/bin/java.exe"
          $overlayFiles = @(Get-ChildItem -LiteralPath $overlay -File -Recurse)
          $files = @((Get-Item -LiteralPath $java)) + $jars + $overlayFiles
          $entries = @(
            foreach ($item in $files) {
              $relative = $item.FullName.Substring($runtime.Length + 1).Replace("\","/")
              [ordered]@{
                path = $relative
                length = [long]$item.Length
                sha256 = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            }
          )
          if ($overlayFiles.Count -lt 3) { throw "Missing hashed ResourceBundle overlay and Java bootstrap" }
          $manifest = @{version=1;files=$entries} | ConvertTo-Json -Depth 5 -Compress
          [System.IO.File]::WriteAllText((Join-Path $runtime "runtime-integrity-v1.json"),
            $manifest, [System.Text.UTF8Encoding]::new($false))

          # Do not ship a distribution whose expected argparse4j resource is
          # absent even in the *original* verified upstream release.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $foundClass = $false
          $foundBundle = $false
          foreach ($jar in $jars) {
            $zip = [System.IO.Compression.ZipFile]::OpenRead($jar.FullName)
            try {
              if ($null -ne $zip.GetEntry("net/sourceforge/argparse4j/internal/ArgumentParserImpl.class")) {
                $foundClass = $true
                if ($null -ne $zip.GetEntry("net/sourceforge/argparse4j/internal/ArgumentParserImpl.properties") -or
                    $null -ne $zip.GetEntry("net/sourceforge/argparse4j/internal/ArgumentParserImpl_en.properties")) {
                  $foundBundle = $true
                }
              }
            } finally { $zip.Dispose() }
          }
          if (-not $foundClass -or -not $foundBundle) {
            throw "Missing argparse4j class or property resource in bundled runtime"
          }

      # Emulate a Chinese Windows JVM locale even on the English GitHub runner.
      # argparse4j no longer falls back to English on an unsupported zh_CN
      # locale. The bundled daemon explicitly overrides it in MS002.
      - name: Chinese locale / argparse4j compatibility smoke test
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $runtime = Join-Path $pwd "artifacts/publish/Runtime/signal-stack-v1"
          $java = Join-Path $runtime "jre/bin/java.exe"
          $cp = Join-Path $runtime "signal-cli/lib/*"
          $env:JAVA_TOOL_OPTIONS = "-Duser.language=zh -Duser.country=CN"
          try {
            $overlay = Join-Path $runtime "signal-cli/resource-overlay"
            $cp = "$overlay;$cp"
            & $java "-Duser.language=en" "-Duser.country=US" -classpath $cp MS002ResourceBundleProbe
            if ($LASTEXITCODE -ne 0) { throw "Actual ResourceBundle lookup failed on zh_CN" }
            & $java "-Duser.language=en" "-Duser.country=US" -classpath $cp org.asamk.signal.Main --version
            if ($LASTEXITCODE -ne 0) {
              throw "signal-cli failed on a simulated zh_CN Windows Java locale"
            }
          } finally {
            Remove-Item Env:JAVA_TOOL_OPTIONS -ErrorAction SilentlyContinue
          }

      - name: Signal JSON-RPC daemon smoke test
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $runtime = Join-Path $pwd "artifacts/publish/Runtime/signal-stack-v1"
          $java = Join-Path $runtime "jre/bin/java.exe"
          $cp = (Join-Path $runtime "signal-cli/resource-overlay") + ";" +
            (Join-Path $runtime "signal-cli/lib/*")
          $stdout = Join-Path $env:RUNNER_TEMP "signal-daemon.out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "signal-daemon.err.log"
          $proc = Start-Process -FilePath $java -ArgumentList @("-Duser.language=en","-Duser.country=US","-classpath",$cp,"org.asamk.signal.Main","--output=json","daemon","--http=127.0.0.1:7583") -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ok = $false
            for ($i=0; $i -lt 45; $i++) {
              Start-Sleep -Milliseconds 750
              if ($proc.HasExited) { break }
              try {
                $body = @{ jsonrpc = "2.0"; method = "listAccounts"; id = 1 } | ConvertTo-Json -Compress
                $reply = Invoke-RestMethod -Method Post -ContentType "application/json" -Body $body -Uri "http://127.0.0.1:7583/api/v1/rpc" -TimeoutSec 3
                if ($reply.jsonrpc -eq "2.0" -and $null -ne $reply.result) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) {
              if (Test-Path $stdout) { Get-Content $stdout -Tail 100 }
              if (Test-Path $stderr) { Get-Content $stderr -Tail 100 }
              throw "signal-cli daemon JSON-RPC smoke test failed"
            }
          } finally {
            if ($proc -and -not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            Get-Process "java" -ErrorAction SilentlyContinue | Stop-Process -Force
          }

      - name: Install pinned Inno Setup
        shell: powershell
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Build installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force artifacts/installer | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DPublishRoot=$pwd\artifacts\publish" "/DOutputRoot=$pwd\artifacts\installer" "installer\SignalScheduler.iss"

      - name: Installer smoke test
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $setup = Get-ChildItem artifacts/installer/SignalScheduler_Setup_V9*.exe | Select-Object -First 1
          if (-not $setup) { throw "Installer not found" }
          $unicodePath = "SignalSchedulerV9-" + [char]0x4E2D + [char]0x6587 + "-CI-Smoke"
          $testRoot = Join-Path $env:LOCALAPPDATA $unicodePath
          $install = Start-Process -FilePath $setup.FullName -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$testRoot","/TASKS=desktopicon") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer exited with $($install.ExitCode)" }
          Start-Sleep -Seconds 2
          if (-not (Test-Path (Join-Path $testRoot "SignalScheduler.exe"))) { throw "Desktop executable missing after install" }
          if (-not (Test-Path (Join-Path $testRoot "signal-brand.ico"))) { throw "Brand icon missing after install" }
          if (-not (Test-Path (Join-Path $testRoot "Engine\SignalScheduler.Engine.exe"))) { throw "Engine executable missing after install" }
          if (-not (Test-Path (Join-Path $testRoot "Runtime\signal-stack-v1\jre\bin\java.exe"))) { throw "Bundled Java missing after install" }
          if (-not (Test-Path (Join-Path $testRoot "Runtime\signal-stack-v1\signal-cli\bin\signal-cli.bat"))) { throw "Bundled signal-cli missing after install" }
          $runtimeManifest = Join-Path $testRoot "Runtime\signal-stack-v1\runtime-integrity-v1.json"
          if (-not (Test-Path -LiteralPath $runtimeManifest)) { throw "Runtime SHA256 manifest missing from installed EXE" }
          $manifest = Get-Content -LiteralPath $runtimeManifest -Raw | ConvertFrom-Json
          if ($manifest.version -ne 1 -or @($manifest.files).Count -lt 2) { throw "Invalid installed runtime manifest" }
          foreach ($entry in @($manifest.files)) {
            $file = Join-Path (Join-Path $testRoot "Runtime\signal-stack-v1") $entry.path
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing verified installed runtime file" }
            if ((Get-Item -LiteralPath $file).Length -ne [long]$entry.length -or
                (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.sha256) {
              throw "SHA256 mismatch in installed runtime file"
            }
          }

          # The Windows JRE launcher can fail to resolve java.dll under a
          # Unicode directory. The Engine MUST stage the verified runtime in
          # a protected ASCII directory before invoking the JVM. Do not run
          # the source java.exe directly here: that is the regression case.
          $installedJava = Join-Path $testRoot "Runtime\signal-stack-v1\jre\bin\java.exe"
          if (-not (Test-Path -LiteralPath $installedJava)) {
            throw "Bundled Java missing from Unicode app installation"
          }

          $desktop = [Environment]::GetFolderPath("Desktop")
          $programs = [Environment]::GetFolderPath("Programs")
          if (-not (Test-Path (Join-Path $desktop "Signal Auto Scheduler.lnk"))) { throw "Desktop shortcut missing" }
          if (-not (Test-Path (Join-Path $programs "Signal Auto Scheduler\Signal Auto Scheduler.lnk"))) { throw "Start Menu shortcut missing" }

          # Upgrade smoke test: leave Engine + its Java/signal-cli running, then reinstall.
          # The installer must close them through the safe IPC handshake without an English
          # Restart Manager prompt or a force-kill on safe-protocol builds.
          $engineExe = Join-Path $testRoot "Engine\SignalScheduler.Engine.exe"
          # Regression: a Chinese locale inherited by Java must not crash the
          # bundled signal-cli daemon launched by the installed Engine.
          $env:JAVA_TOOL_OPTIONS = "-Duser.language=zh -Duser.country=CN"
          $engineProc = Start-Process -FilePath $engineExe -ArgumentList @("--background") -PassThru -WindowStyle Hidden
          # Startup may hold the single-instance mutex before IPC becomes ready,
          # especially while the bundled Java daemon initializes. Require an
          # actual pipe response instead of assuming that five seconds suffice.
          $ready = $false
          for ($probe = 1; $probe -le 24; $probe++) {
            if ($engineProc.HasExited) { throw "Engine exited before upgrade smoke test" }
            $pipe = [System.IO.Pipes.NamedPipeClientStream]::new(".","SignalScheduler.V8.Control",[System.IO.Pipes.PipeDirection]::InOut,[System.IO.Pipes.PipeOptions]::Asynchronous)
            try {
              $pipe.Connect(800)
              # NamedPipeClientStream.ReadTimeout is not supported for this
              # asynchronous pipe on all Windows runners; setting it throws
              # SetValueInvocationException before the first ping is sent.
              # Bound ReadLineAsync explicitly instead and fail closed.
              $writer = [System.IO.StreamWriter]::new($pipe)
              $writer.AutoFlush = $true
              $reader = [System.IO.StreamReader]::new($pipe)
              $writer.WriteLine('{"Command":"ping"}')
              $readTask = $reader.ReadLineAsync()
              if (-not $readTask.Wait(3000)) {
                throw "Engine IPC ping timed out after 3 seconds"
              }
              $reply = $readTask.Result
              if ($reply -and ((ConvertFrom-Json -InputObject $reply).Ok -eq $true)) {
                $ready = $true
                break
              }
            }
            catch {
              if ($probe -eq 24) { Write-Warning "Engine ping failed: $($_.Exception.ToString())" }
            }
            finally { $pipe.Dispose() }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ready) { throw "Engine IPC did not become ready for safe upgrade" }

          # An IPC-ready Engine is not proof that signal-cli started. Confirm
          # the installed daemon actually reaches JSON-RPC healthy when
          # launched from a Unicode Windows path with an inherited zh_CN JVM.
          $signalHealthy = $false
          for ($i=0; $i -lt 50; $i++) {
            $pipe = [System.IO.Pipes.NamedPipeClientStream]::new(".","SignalScheduler.V8.Control",[System.IO.Pipes.PipeDirection]::InOut,[System.IO.Pipes.PipeOptions]::Asynchronous)
            try {
              $pipe.Connect(800)
              $writer = [System.IO.StreamWriter]::new($pipe)
              $writer.AutoFlush = $true
              $reader = [System.IO.StreamReader]::new($pipe)
              $writer.WriteLine('{"Command":"signal-status"}')
              $read = $reader.ReadLineAsync()
              if (-not $read.Wait(3000)) { throw "Signal state IPC timeout" }
              $reply = ConvertFrom-Json -InputObject $read.Result
              if ($reply.Ok -and $reply.Data.State -eq "healthy") {
                $signalHealthy = $true
                break
              }
              if ($reply.Ok -and $reply.Data.State -in @("fault","missing-runtime","external-conflict")) {
                throw "Installed Unicode path daemon failed with state $($reply.Data.State)"
              }
            } finally { $pipe.Dispose() }
            Start-Sleep -Seconds 1
          }
          if (-not $signalHealthy) { throw "Installed Engine failed to start healthy signal-cli on Unicode path" }

          # This test must run as the installed executable's Windows user:
          # confirm that the Java process actually uses the private, ASCII-
          # only staged runtime and that this stage is hash-verified.
          $userSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $commonDocs = [Environment]::GetFolderPath([Environment+SpecialFolder]::CommonDocuments)
          $privateRuntime = Join-Path $commonDocs ("MS002_Runtime_" + $userSid)
          if (-not (Test-Path -LiteralPath $privateRuntime)) {
            throw "Unicode installation did not stage bundled Java to a protected ASCII path"
          }
          $stages = @(Get-ChildItem -LiteralPath $privateRuntime -Directory)
          if ($stages.Count -lt 1) { throw "No staged Java runtime was created" }
          $staged = $stages[0].FullName
          if ($staged.ToCharArray() | Where-Object { [int]$_ -gt 127 }) {
            throw "Staged Java runtime path is not ASCII-only"
          }
          $stagedJava = Join-Path $staged "jre\bin\java.exe"
          $stagedCp = (Join-Path $staged "signal-cli\resource-overlay") + ";" + (Join-Path $staged "signal-cli\lib\*")
          & $stagedJava "-Duser.language=en" "-Duser.country=US" -classpath $stagedCp MS002ResourceBundleProbe
          if ($LASTEXITCODE -ne 0) {
            throw "Installed staged Java could not load argparse4j ResourceBundle"
          }
          if (-not (Test-Path -LiteralPath $stagedJava)) {
            throw "Protected runtime lacks java.exe"
          }
          & $stagedJava "-Duser.language=en" "-Duser.country=US" -classpath $stagedCp org.asamk.signal.Main --version
          if ($LASTEXITCODE -ne 0) {
            throw "Staged ASCII Java runtime could not load signal-cli"
          }
          $stagedManifest = Join-Path $staged "runtime-integrity-v1.json"
          $stagedProbe=Join-Path $staged "signal-cli/resource-overlay/MS002ResourceBundleProbe.class"
          if (-not (Test-Path -LiteralPath $stagedProbe)) {
            throw "Java ResourceBundle preflight missing from installed runtime"
          }
          if (-not (Test-Path -LiteralPath $stagedManifest)) { throw "Staged runtime missing integrity manifest" }
          $verifyStage = Get-Content -LiteralPath $stagedManifest -Raw | ConvertFrom-Json
          foreach ($entry in @($verifyStage.files)) {
            $stagedFile = Join-Path $staged $entry.path
            if (-not (Test-Path -LiteralPath $stagedFile) -or
                (Get-FileHash -LiteralPath $stagedFile -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry.sha256) {
              throw "Staged runtime JAR integrity mismatch"
            }
          }

          # Snapshot real V8 user-facing records in the isolated runner database:
          # remarks, edited script and revision, selected group, completed
          # dispatch history, local preferences and a user-owned file.
          # Expected values live OUTSIDE the app and data directories.
          $userDataRoot = Join-Path $env:LOCALAPPDATA "SignalSchedulerData"
          $expectedData = Join-Path $env:RUNNER_TEMP "ms002-upgrade-user-expected.json"
          python tools/verify_upgrade_userdata.py seed "$userDataRoot" "$expectedData"
          if ($LASTEXITCODE -ne 0) { throw "Failed to seed isolated upgrade preservation fixture" }
          # Baseline must compare equal BEFORE installing anything. If not,
          # the preservation checker itself is broken (not evidence of data loss).
          python tools/verify_upgrade_userdata.py verify "$userDataRoot" "$expectedData"
          if ($LASTEXITCODE -ne 0) { throw "CI fixture self-check failed before upgrade" }

          # Simulate a stale JAR from an older install. Pre-V9.0.4 releases
          # laid the new files over existing ones without removing old libs.
          # V9.0.4 must remove this *application-owned* file during upgrade,
          # while preserving all user-owned data under SignalSchedulerData.
          $staleJar = Join-Path $testRoot "Runtime\signal-stack-v1\signal-cli\lib\legacy-argparse4j.jar"
          $jar = Get-ChildItem -LiteralPath (Join-Path $testRoot "Runtime\signal-stack-v1\signal-cli\lib") -Filter "*.jar" -File | Select-Object -First 1
          if (-not $jar) { throw "Missing installation JAR fixture" }
          Copy-Item -LiteralPath $jar.FullName -Destination $staleJar
          if (-not (Test-Path -LiteralPath $staleJar)) { throw "Could not seed stale JAR fixture" }

          $upgradeLog = Join-Path $env:RUNNER_TEMP "ms002-upgrade-setup.log"
          $upgrade = Start-Process -FilePath $setup.FullName -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$testRoot","/TASKS=desktopicon","/LOG=$upgradeLog") -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) {
            if (Test-Path $upgradeLog) {
              Write-Host "Installer preparation failure diagnostics:"
              Get-Content -LiteralPath $upgradeLog -Tail 70
            }
            throw "In-place upgrade exited with $($upgrade.ExitCode)"
          }
          Start-Sleep -Seconds 2

          if (Test-Path -LiteralPath $staleJar) {
            throw "In-place upgrade failed to remove stale unmanifested JAR"
          }
          if (Get-Process "SignalScheduler.Engine" -ErrorAction SilentlyContinue) { throw "Engine still running after safe upgrade handshake" }
          if (Get-Process "java" -ErrorAction SilentlyContinue) { throw "Engine-owned Java still running after safe upgrade handshake" }

          python tools/verify_upgrade_userdata.py verify "$userDataRoot" "$expectedData"
          if ($LASTEXITCODE -ne 0) { throw "User data changed or disappeared during in-place upgrade" }

          # Validate that a successful upgrade did not merely preserve data
          # while leaving the actual program or bundled runtime unusable.
          $upgradedDesktop = Join-Path $testRoot "SignalScheduler.exe"
          $upgradedEngine = Join-Path $testRoot "Engine\\SignalScheduler.Engine.exe"
          $upgradedJava = Join-Path $testRoot "Runtime\\signal-stack-v1\\jre\\bin\\java.exe"
          $upgradedCp = Join-Path $testRoot "Runtime\\signal-stack-v1\\signal-cli\\lib\\*"
          foreach ($requiredFile in @($upgradedDesktop,$upgradedEngine,$upgradedJava)) {
            if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
              throw "Missing installed file after upgrade: $requiredFile"
            }
          }
          # Source remains under a Unicode path. Launch the verified ASCII
          # stage instead; no Java DLL must ever be loaded from the path above.
          & $stagedJava "-Duser.language=en" "-Duser.country=US" -classpath $stagedCp org.asamk.signal.Main --version
          if ($LASTEXITCODE -ne 0) { throw "Protected signal-cli runtime unusable after upgrade" }

          # Run desktop from the upgraded installation rather than just from
          # the pre-install publish output. No account or network send needed.
          $upgradedApp = Start-Process -FilePath $upgradedDesktop -PassThru
          try {
            Start-Sleep -Seconds 5
            $upgradedApp.Refresh()
            if ($upgradedApp.HasExited) {
              throw "Installed desktop exited after upgrade: $($upgradedApp.ExitCode)"
            }
          }
          finally {
            $upgradedApp.Refresh()
            if (-not $upgradedApp.HasExited) {
              $upgradedApp.CloseMainWindow() | Out-Null
              if (-not $upgradedApp.WaitForExit(10000)) {
                # CI-only process cleanup; production installer never force-kills.
                Stop-Process -Id $upgradedApp.Id -Force
              }
            }
          }
          # An upgraded UI launch must not alter real user-facing records.
          python tools/verify_upgrade_userdata.py verify "$userDataRoot" "$expectedData"
          if ($LASTEXITCODE -ne 0) { throw "Desktop launch after upgrade modified the data fixture" }

          $uninstall = Join-Path $testRoot "unins000.exe"
          if (Test-Path $uninstall) {
            $u = Start-Process -FilePath $uninstall -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART") -Wait -PassThru
            if ($u.ExitCode -ne 0) { throw "Uninstaller exited with $($u.ExitCode)" }
            python tools/verify_upgrade_userdata.py verify "$userDataRoot" "$expectedData"
            if ($LASTEXITCODE -ne 0) { throw "Uninstall erased user-owned profile data" }
          }

      - name: Hash installer
        shell: powershell
        run: Get-FileHash artifacts/installer/*.exe -Algorithm SHA256 | Format-List | Out-File artifacts/installer/SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SignalScheduler-V9-Windows
          path: artifacts/installer/*
          if-no-files-found: error

      # Publish immutable offline installer from exactly this fully tested CI run.
      # Keep the update manifest behind this step to avoid linking unpublished files.
      - name: Publish verified installer to GitHub Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '9.0.6'
          $tag = "v$version"
          $installer = "artifacts/installer/SignalScheduler_Setup_V$version.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Verified installer missing" }
          & gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists; bump version before publishing another build."
          }
          & gh release create $tag $installer "artifacts/installer/SHA256.txt" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Signal Auto Scheduler $version (Windows x64)" --notes "MS002 V9.0.6 正式版（Windows 10/11 x64 离线安装包）。修复 Signal 进程退出事件与后台正常恢复之间的竞争，避免短暂恢复阶段反复弹出严重故障。增加真实进程退出码、固定脱敏 JVM 故障分类（内存、原生依赖、类路径、语言资源、端口、权限、账号及网络）及诊断导出；同一进程在 5 分钟内连续异常退出三次时停止无意义的自动重启，保留任务与账号资料。沿用 V9.0.5 的完整性检查、中文路径兼容、独立资源探针与安全覆盖升级。"
          if ($LASTEXITCODE -ne 0) { throw "Release upload failed; do not publish update manifest" }

      # Publish only after the installer was built, installed, smoke-tested,
      # hashed and uploaded. Static raw.githubusercontent.com reads do not
      # consume the unauthenticated REST API limit (60 requests/hour).
      # The dedicated 'updates' branch is not built by this workflow.
      - name: Publish quota-free verified update manifest
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem "artifacts/installer/SignalScheduler_Setup_V9*.exe" |
            Select-Object -First 1
          if (-not $installer) { throw "Verified installer missing" }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -notmatch '^[0-9a-f]{64}$') { throw "Invalid installer hash" }
          $manifest = @{
            version = '9.0.6'
            build = [int]$env:GITHUB_RUN_NUMBER
            runId = [long]$env:GITHUB_RUN_ID
            sourceSha = $env:GITHUB_SHA
            installerSha256 = $hash
          } | ConvertTo-Json -Compress
          $feedDir = Join-Path $env:RUNNER_TEMP "ms002-verified-update-feed"
          New-Item -ItemType Directory -Path $feedDir -Force | Out-Null
          [System.IO.File]::WriteAllText(
            (Join-Path $feedDir "latest.json"), $manifest,
            [System.Text.UTF8Encoding]::new($false))
          Push-Location $feedDir
          try {
            & git init -b updates
            if ($LASTEXITCODE -ne 0) { throw "Could not initialize update feed" }
            & git config user.name "github-actions[bot]"
            & git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            & git add latest.json
            & git commit -m "publish CI-verified MS002 build $env:GITHUB_RUN_NUMBER"
            if ($LASTEXITCODE -ne 0) { throw "Could not commit update feed" }
            & git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
            $bytes = [System.Text.Encoding]::ASCII.GetBytes("x-access-token:$env:GH_TOKEN")
            $auth = [Convert]::ToBase64String($bytes)
            & git -c "http.extraheader=AUTHORIZATION: basic $auth" push --force origin HEAD:refs/heads/updates
            if ($LASTEXITCODE -ne 0) { throw "Could not publish update feed" }
          }
          finally { Pop-Location }
          Write-Host "Published update feed for verified build $env:GITHUB_RUN_NUMBER"
